<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog — CineVault</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="images/logo.svg" alt="">CineVault</a>
      <nav class="nav" id="site-nav" data-nav-menu>
        <a href="index.html" data-nav="home">Home</a>
        <a href="catalog.html" data-nav="catalog">Catalog</a>
        <a href="watchlist.html" data-nav="watchlist">Watchlist</a>
        <a href="about.html" data-nav="about">About</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" data-theme-toggle type="button" aria-label="Toggle color mode">
          <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn-ghost" href="login.html" data-auth-link>Log in</a>
        <a class="btn btn-primary" href="profile.html" data-profile-link hidden>Profile</a>
        <button class="icon-btn menu-toggle" data-menu-toggle type="button" aria-label="Open menu" aria-controls="site-nav" aria-expanded="false"><span class="hamburger"></span></button>
      </div>
    </div>
  </header>

  <main id="main" class="container section">
    <p class="kicker">Browse</p>
    <h1>Catalog</h1>
    <p class="lead">Search TVMaze and filter by genre. Your last query is stored in localStorage so it returns when you come back.</p>

    <form id="search-form" class="toolbar" novalidate>
      <label class="search-field">
        Title
        <input name="q" type="text" placeholder="Try Breaking Bad, Fleabag, Dark…">
      </label>
      <label class="field">
        Genre
        <select name="genre">
          <option value="all">All genres</option>
          <option value="Drama">Drama</option>
          <option value="Comedy">Comedy</option>
          <option value="Crime">Crime</option>
          <option value="Science-Fiction">Science-Fiction</option>
          <option value="Thriller">Thriller</option>
          <option value="Action">Action</option>
        </select>
      </label>
      <button class="btn btn-primary" type="submit">Search titles</button>
    </form>

    <div class="api-status" data-api-status></div>
    <div class="skeleton-grid" data-skeletons>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <div class="card-grid" data-catalog></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>CineVault · student project · SE-2512 · 2026</p>
      <p>Data courtesy of <a href="https://www.tvmaze.com/api" rel="noreferrer">TVMaze</a></p>
    </div>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
